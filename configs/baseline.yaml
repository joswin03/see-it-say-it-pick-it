# Baseline protocol: Apertus alone, plain prompt (baseline/baseline.py), served by vLLM on Marimo.
# Deviations from the README command `vllm serve swiss-ai/Apertus-v1.5-8B
# --chat-template-content-format string`: max_model_len and gpu_memory_fraction set below, and
# the FlashInfer sampler disabled (env_overrides). None changes answers at temperature 0.

model_id: swiss-ai/Apertus-v1.5-8B
model_path: /marimo/models/Apertus-v1.5-8B
vllm_env: /marimo/vllm-env  # built by scripts/install_vllm_apertus.sh (swiss-ai vLLM fork)

server:
  port: 8000
  gpu_memory_fraction: 0.45  # leaves room for a vision model on the same 96 GB GPU
  max_model_len: 32768  # model card uses 262144; a single photo + prompt needs far less
  startup_timeout_s: 1200
  chat_template_content_format: string  # as in the README command
  env_overrides:
    VLLM_USE_FLASHINFER_SAMPLER: "0"  # FlashInfer JIT sampler fails to compile on molab (nvcc/header mismatch); no effect at temperature 0

decode:  # values fixed inside baseline/baseline.py, recorded here
  temperature: 0
  max_tokens: 400
  max_side: 1024
